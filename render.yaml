services:
  - type: web
    name: labocq
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DB_PATH
        value: /data/labo_cq.db     # Points to the persistent disk below
    disk:
      name: labocq-data
      mountPath: /data
      sizeGB: 1                      # 1 GB persistent disk (keeps DB across restarts)
